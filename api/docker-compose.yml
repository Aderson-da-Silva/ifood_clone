version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"  # Mapeando para porta 5433 externamente, mantendo 5432 internamente
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nestjs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  api:
    build:
      context: .
      target: development  # Explicitly use the development target
    ports:
      - "3000:3000" # API REST
      - "3001:3001" # WebSocket de rastreio
      - "3002:3002" # WebSocket de chat
    depends_on:
      - redis
      - mongodb
      - postgres
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres  # Override to use the service name
      - REDIS_HOST=redis        # Override to use the service name
      - MONGODB_HOST=mongodb    # Override to use the service name
    volumes:
      - ./:/app
      # - /app/node_modules  # This prevents the container's node_modules from being overwritten
    command: npm run start:dev

volumes:
  redis_data:
  mongodb_data:
  postgres_data:
